name: Verify staged archive chunks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-staged-chunks.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          check() {
            file="$1"
            expected="$2"
            actual="$(tr -d '[:space:]' < "$file" | sha256sum | awk '{print $1}')"
            if [ "$actual" = "$expected" ]; then
              echo "OK $file"
            else
              echo "MISMATCH $file expected=$expected actual=$actual"
            fi
          }
          check .kernel_transfer/part01.b64 039092e83500678aa21b4fbc430a1c6f85511b6fd0009b2eae123f1c6e869d08
          check .kernel_transfer/part02.b64 e2ca29663df4d5f63364cea961f5da4eb76191f92c0e2f25ad5b1a996f76b528
          check .kernel_transfer/part03.b64 dfd1e41c3d3a0f61d6465fded86c42850e3670e1db948b3768c5ef8e34e91c7a
          check .kernel_transfer/part04.b64 b273418a1550780212ccf9a38af8350aa45cebf71b07e209379e4997ef9a7aa0
