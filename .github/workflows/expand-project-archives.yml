name: Expand project archives

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expand-project-archives.yml"

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand archives
        shell: bash
        run: |
          set -euo pipefail
          rm -rf XenV2 AegisLab
          mkdir -p XenV2 AegisLab
          unzip -q XenV2_SOURCE_SHARE.zip -d XenV2
          unzip -q AegisLab_UPDATED_SOURCE_SHARE.zip -d AegisLab

      - name: Commit expanded files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XenV2 AegisLab
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Expand project source archives"
          git push
